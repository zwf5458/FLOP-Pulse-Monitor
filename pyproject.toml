[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-pulse-monitor"
version = "1.0.0"
authors = [
  { name="FLOP Technocore Operators", email="operators@technocore.chat" },
]
description = "Real-time latency, room velocity and Prometheus exporter for FLOP Technocore nodes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/zwf5458/FLOP-Pulse-Monitor"
"Bug Tracker" = "https://github.com/zwf5458/FLOP-Pulse-Monitor/issues"

[project.scripts]
flop-pulse = "tools.pulse_monitor:main"
flop-exporter = "tools.exporter_prometheus:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
